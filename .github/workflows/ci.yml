name: CI

on:
  pull_request:
  push:
    branches: [main, develop, "release/**"]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      LOCAL_MODE: "true"
      MONGODB_URI_LOCAL: mongodb://localhost:27017/mmaGameCI
      REDIS_URL_LOCAL: redis://127.0.0.1:6379
      JWT_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install API deps
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Install frontend deps
        run: npm ci
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend
